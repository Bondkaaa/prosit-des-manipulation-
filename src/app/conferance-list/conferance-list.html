<h1>Conferences</h1>

@if (errorMessage()) {
  <p role="alert">{{ errorMessage() }}</p>
}

<div class="cards-container">
  @for (conf of conferances(); track conf.id) {
    <div class="card">

      <img
        src="https://images.unsplash.com/photo-1540575467063-178a50c2df87"
        alt="Conference"
      />

      <div class="card-content">
        <h2>{{ conf.name }}</h2>

        <p>📅 {{ conf.date }}</p>
        <p>📍 {{ conf.location }}</p>

      </div>
      <div class="card-actions">
        <button type="button" [routerLink]="['/details', conf.id]">Details</button>
        <button type="button" [routerLink]="['/update', conf.id]">Modifier</button>
        <button type="button" class="delete-button" (click)="deleteConferance(conf.id)">Supprimer</button>
      </div>
    </div>
  }
</div>
