<h1>Modifier une conférence</h1>

@if (errorMessage) {
  <p role="alert">{{ errorMessage }}</p>
} @else {
  <form [formGroup]="conferenceForm" (ngSubmit)="updateConferance()">
    <label for="name">Nom</label>
    <input id="name" type="text" formControlName="name" required />

    <label for="description">Description</label>
    <textarea id="description" formControlName="description"></textarea>

    <label for="location">Lieu</label>
    <input id="location" type="text" formControlName="location" required />

    <label for="date">Date</label>
    <input id="date" type="text" formControlName="date" required />

    <label for="time">Heure</label>
    <input id="time" type="text" formControlName="time" />

    <label for="price">Prix</label>
    <input id="price" type="number" formControlName="price" min="0" />

    <label for="nbPlaces">Nombre de places</label>
    <input id="nbPlaces" type="number" formControlName="nbPlaces" min="0" />

    <label for="imageUrl">URL de l’image</label>
    <input id="imageUrl" type="url" formControlName="imageUrl" />

    <button type="submit" [disabled]="conferenceForm.invalid">Enregistrer</button>
    <button type="button" (click)="cancel()">Annuler</button>
  </form>
}
