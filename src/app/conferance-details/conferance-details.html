@if (conferance; as conf) {
	<main class="details">
		<h1>{{ conf.name }}</h1>
		<p><strong>Date:</strong> {{ conf.date }}</p>
		<p><strong>Place:</strong> {{ conf.place }}</p>
		<a routerLink="/list">Back to conferences</a>
	</main>
} @else {
	<main class="details">
		<h1>Conference not found</h1>
		<a routerLink="/list">Back to conferences</a>
	</main>
}
